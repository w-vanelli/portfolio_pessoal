# Integration test profile — used by AbstractIntegrationTest
# Datasource properties are injected dynamically by Testcontainers via @DynamicPropertySource.
# Flyway creates the schema; Hibernate only validates it (ddl-auto: validate).

spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Disable RabbitMQ auto-configuration to avoid container dependency in this phase
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

ledgerstream:
  storage:
    staging-dir: ${java.io.tmpdir}/ledgerstream-test/staging
    permanent-dir: ${java.io.tmpdir}/ledgerstream-test/permanent
