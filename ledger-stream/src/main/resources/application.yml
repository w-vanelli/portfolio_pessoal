spring:
  application:
    name: ledger-stream

  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerstream
    username: ledger
    password: ledger_secret_pwd
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: LedgerStreamHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3
        multiplier: 2.0
        max-interval: 10000ms

ledgerstream:
  storage:
    staging-dir: ./storage/staging
    permanent-dir: ./storage/permanent
  queue:
    settlement-events: ledger.settlement.events
    settlement-dlq: ledger.settlement.events.dlq
    exchange: ledger.settlement.exchange
    dlx: ledger.settlement.dlx

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

server:
  port: 8080
  shutdown: graceful
