services:
  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledgerstream
      SPRING_DATASOURCE_USERNAME: ledger
      SPRING_DATASOURCE_PASSWORD: ledger_secret_pwd
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      LEDGERSTREAM_STORAGE_STAGING_DIR: /app/storage/staging
      LEDGERSTREAM_STORAGE_PERMANENT_DIR: /app/storage/permanent
    ports:
      - "8080:8080"
    volumes:
      - app_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ledgerstream-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledgerstream
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger_secret_pwd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledgerstream"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ledgerstream-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ledgerstream-network

volumes:
  app_storage:
  postgres_data:
  rabbitmq_data:

networks:
  ledgerstream-network:
    driver: bridge
